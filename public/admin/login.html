<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Edupearl Immigration Services and Language Point - Staff Administration Portal Login.">
  <title>Staff Portal Login — Edupearl Immigration Services and Language Point</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/admin/css/admin.css">
</head>
<body class="login-body">

  <main class="login-container">
    <div class="login-card">
      <div class="login-brand">
        <a href="/" aria-label="Edupearl Home">
          <img src="/images/Edu Pearl Education Logo.png" alt="Edupearl Immigration Services and Language Point logo" class="login-logo">
        </a>
        <h1>Staff Management Portal</h1>
        <p>Authorized Personnel Only</p>
      </div>

      <div class="login-subtitle">
        Enter your administrative credentials to access the management dashboard.
      </div>

      <!-- Feedback / Alert Container -->
      <div id="login-alert-container" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="login-form" novalidate autocomplete="off">
        <div class="form-group">
          <label for="identifier" class="form-label">
            Username or Email Address <span class="required" aria-hidden="true">*</span>
          </label>
          <input 
            type="text" 
            id="identifier" 
            name="identifier" 
            class="form-control" 
            placeholder="e.g. jujhar or staff@edupearl.in" 
            autocomplete="username" 
            required 
            autofocus
            maxlength="100"
          >
        </div>

        <div class="form-group">
          <label for="password" class="form-label">
            Password <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="input-password-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-control" 
              placeholder="Enter your password" 
              autocomplete="current-password" 
              required
              maxlength="255"
            >
            <button 
              type="button" 
              class="btn-toggle-password" 
              id="btn-toggle-password" 
              aria-label="Show password"
              aria-pressed="false"
            >
              <span id="toggle-password-icon" aria-hidden="true">👁️</span>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit" style="margin-top: 1.5rem;">
          <span id="btn-submit-text">Log In to Portal</span>
          <span id="btn-submit-spinner" class="spinner" style="display: none;" aria-hidden="true"></span>
        </button>
      </form>

      <div class="login-card-footer" style="margin-top: 1.75rem;">
        <a href="/">← Return to Public Website</a>
      </div>
    </div>
  </main>

  <script src="/admin/js/admin-api.js"></script>
  <script src="/admin/js/login.js"></script>
</body>
</html>
